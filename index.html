
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/x-icon" href="./form-svgrepo-com.svg">

</head>

<body>

<div class="container">

    <h2>Registration Form</h2>

    <form id="registrationForm">

        <label>First Name:</label>
        <input type="text" name="firstname"
        placeholder="Enter first name" required>

        <label>Last Name:</label>
        <input type="text" name="lastname"
        placeholder="Enter last name" required>

        <label>Email:</label>
        <input type="email" name="email"
        placeholder="Enter email address" required>

        <label>Password:</label>
        <input type="password" id="password"
        placeholder="Enter password" required>

        <label>Confirm Password:</label>
        <input type="password" id="confirmPassword"
        placeholder="Confirm password" required>

        <label>Gender:</label>
        <div class="options">
            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other
        </div>

        <label>Date of Birth:</label>
        <input type="date" name="dob" required>

        <label>Education Qualification:</label>
        <select name="qualification" required>
            <option value="">-- Select Qualification --</option>
            <option>10th</option>
            <option>12th</option>
            <option>Diploma</option>
            <option>Graduation</option>
            <option>Post Graduation</option>
            <option>Other</option>
        </select>

        <label>Skills:</label>
        <div class="options">
            <input type="checkbox" name="skills" value="HTML"> HTML
            <br><br>
            <input type="checkbox" name="skills" value="CSS"> CSS
            <br><br>
            <input type="checkbox" name="skills" value="JavaScript"> JavaScript
            <br><br>
            <input type="checkbox" name="skills" value="Python"> Python
            <br><br>
            <input type="checkbox" name="skills" value="Java"> Java
        </div>

        <div class="declaration">
            <input type="checkbox" name="declaration" required>
            I hereby declare that all the information
            provided by me is true and correct.
        </div>

        <div class="buttons">
            <button type="submit" class="register">
                Register
            </button>

            <button class="reset" onclick="resetfunc()">
                Reset
            </button>
        </div>

    </form>

</div>

<script>

    const form = document.getElementById("registrationForm");

    const input = document.querySelectorAll("input")

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            alert("Password and Confirm Password do not match!");
            return;
        }

        alert("Registration Form Submitted Successfully!")

    });

    function resetfunc(){
        const resetconfirm = confirm("Are you sure you want to reset this form");

        if(resetconfirm){
            form.reset()
        }else{
            return; 
        }
    }


</script>

</body>
</html>
